server:
  address: 127.0.0.1
  port: ${SERVER_PORT:8081}
  # Responses of 1 KiB and more are gzip-compressed when the client asks. The dispatch state endpoint compresses
  # itself; Tomcat skips a response that already has a Content-Encoding.
  compression:
    enabled: true
    # Error bodies (application/problem+json) stay uncompressed so they are readable without a decoder.
    mime-types: application/json
    min-response-size: 1KB
  # Finish in-flight requests on SIGTERM, so a blue/green switch never cuts a checkpoint save.
  shutdown: graceful

spring:
  lifecycle:
    timeout-per-shutdown-phase: 10s
  servlet:
    multipart:
      # The photo endpoint enforces 5 MiB itself and answers PHOTO_TOO_LARGE; this only bounds what the container parses.
      max-file-size: 8MB
      max-request-size: 9MB

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

meatbox:
  auth:
    enabled: ${MEATBOX_AUTH_ENABLED:false}
    access-file: ${MEATBOX_AUTH_ACCESS_FILE:}
    public-origin: ${MEATBOX_PUBLIC_ORIGIN:}
    session-file: ${MEATBOX_AUTH_SESSION_FILE:}
    admin-command: ${MEATBOX_AUTH_ADMIN_COMMAND:}
    admin-output: ${MEATBOX_AUTH_ADMIN_OUTPUT:}
    admin-username: ${MEATBOX_AUTH_ADMIN_USERNAME:}
    admin-expires-in-millis: ${MEATBOX_AUTH_ADMIN_EXPIRES_IN_MILLIS:86400000}
  compat:
    enabled: ${MEATBOX_COMPAT_ENABLED:false}
    legacy-api-origin: ${MEATBOX_LEGACY_API_ORIGIN:}
    dispatch-data-dir: ${MEATBOX_DISPATCH_DATA_DIR:}
  resources:
    enabled: ${MEATBOX_RESOURCES_ENABLED:false}
    database: ${MEATBOX_RESOURCE_DATABASE:}
    public-origin: ${MEATBOX_PUBLIC_ORIGIN:}

  dispatch:
    enabled: ${MEATBOX_DISPATCH_ENABLED:false}
    state-dir: ${MEATBOX_DISPATCH_STATE_DIR:}
    public-origin: ${MEATBOX_PUBLIC_ORIGIN:}

  eta:
    # First ETA model (no routing API): straight-line km x detour-factor / speed-kmh, plus service-minutes per stop.
    detour-factor: ${MEATBOX_ETA_DETOUR_FACTOR:1.4}
    speed-kmh: ${MEATBOX_ETA_SPEED_KMH:25}
    service-minutes: ${MEATBOX_ETA_SERVICE_MINUTES:5}
    # A recomputed ETA is sent to Meatbox again only when it moved this much from the last one sent.
    delay-threshold-minutes: ${MEATBOX_ETA_DELAY_THRESHOLD_MINUTES:10}

  route:
    # Where a vehicle starts before it departs, for the automatic stop order. Both empty: the order starts at the
    # vehicle's reported position, else at the first stop.
    depot-lat: ${MEATBOX_ROUTE_DEPOT_LAT:}
    depot-lng: ${MEATBOX_ROUTE_DEPOT_LNG:}

  ops:
    # Empty webhook URL keeps the default WARN-log channel.
    alert-webhook-url: ${MEATBOX_ALERT_WEBHOOK_URL:}
    server-name: ${MEATBOX_ALERT_SERVER_NAME:}

  inbound:
    # An empty token leaves /api/meatbox/* unmapped (404). Orders already received stay visible either way.
    token: ${MEATBOX_INBOUND_TOKEN:}
    group-count: ${MEATBOX_INBOUND_GROUP_COUNT:8}

  telemetry:
    # An empty token leaves POST /api/telemetry/temperature unmapped (404). Stored values stay readable either way.
    token: ${MEATBOX_TELEMETRY_TOKEN:}
    # A sensor that sent nothing new for this long is marked stale.
    stale-minutes: ${MEATBOX_TELEMETRY_STALE_MINUTES:10}
    # frozen or chilled: the range for vehicles that name none (no compartment, no entry in telemetry/ranges.json).
    # Empty leaves them unjudged.
    default-kind: ${MEATBOX_TELEMETRY_DEFAULT_KIND:}
    # Seconds between passes that turn new measurements into Meatbox messages (contract 3.3: one-minute batches).
    batch-seconds: ${MEATBOX_TELEMETRY_BATCH_SECONDS:60}

  outbound:
    # Empty base URL keeps messages in the outbox without sending. The token is sent as a Bearer header when set.
    base-url: ${MEATBOX_API_BASE_URL:}
    token: ${MEATBOX_API_TOKEN:}
    interval-seconds: ${MEATBOX_OUTBOX_INTERVAL_SECONDS:5}

  # TEST ONLY: stands in for Meatbox's API with no session check. Never enable in production.
  mock-receiver:
    enabled: ${MEATBOX_MOCK_RECEIVER_ENABLED:false}

  export:
    # Command-line export (needs --spring.main.web-application-type=none); empty out means the server runs normally.
    out: ${MEATBOX_EXPORT_OUT:}
    from: ${MEATBOX_EXPORT_FROM:}
    to: ${MEATBOX_EXPORT_TO:}
    include: ${MEATBOX_EXPORT_INCLUDE:}
