<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#e60028">
  <meta name="color-scheme" content="light">
  <title>미트박스 배송조회</title>
  <link rel="manifest" href="/push-lab/manifest.webmanifest">
  <link rel="icon" href="/push-lab/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/push-lab/brand.css">
  <link rel="stylesheet" href="/push-lab/styles.css?v=20260923-3">
  <script type="module" src="/push-lab/app.mjs?v=20260923-3"></script>
</head>
<body>
  <header class="topbar">
    <img class="brand" src="/push-lab/assets/meatbox-logo.svg" width="126" height="30" alt="미트박스">
    <span class="test-badge">TEST</span>
  </header>

  <main>
    <section id="invite-view" class="gate" aria-labelledby="invite-title">
      <h1 id="invite-title">배송조회 링크 확인</h1>
      <p id="invite-message" role="status">보안 링크를 확인하고 있습니다.</p>
    </section>

    <div id="delivery-view" hidden>
      <div class="delivery-panel">
        <section class="delivery-summary" aria-labelledby="delivery-title">
          <h1 id="delivery-title">배송 현황</h1>
          <strong id="current-stage" class="current-stage">배송 정보를 불러오는 중입니다</strong>
          <div id="eta-card" class="eta-card" hidden><span>예상 도착 시각</span><strong id="eta-text">—</strong><small>확정 시각이 아닙니다.</small></div>
        </section>

        <ol id="stage-list" class="stages" aria-label="배송 단계"></ol>
        <p id="status-note" class="status-note" role="status" hidden></p>

        <section class="notification-section" aria-labelledby="notification-title">
          <div class="section-heading"><h2 id="notification-title">배송 알림</h2><span id="notification-state" class="state-badge">신청 전</span></div>
          <p id="support-message" class="support-message" role="status"></p>
          <p id="provider-message" class="support-message" role="status"></p>
          <label id="consent-row" class="consent-row">
            <input id="consent" type="checkbox">
            <span>이번 배송 웹 알림 수신에 동의합니다.<small>알림 받기를 눌러야 신청이 저장됩니다.</small></span>
          </label>
          <div class="actions">
            <button id="subscribe" type="button" class="primary" disabled>알림 받기</button>
            <button id="unsubscribe" type="button" class="text-button" disabled>알림 철회</button>
          </div>
          <p id="notification-detail" class="detail" aria-live="polite"></p>
        </section>
      </div>
      <footer><span id="session-expiry"></span></footer>
    </div>
  </main>
  <noscript><p class="noscript">배송조회와 알림을 사용하려면 JavaScript를 활성화해 주세요.</p></noscript>
</body>
</html>
