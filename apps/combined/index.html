<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="no-referrer">
  <title>운영 뷰어 · 미트박스 TMS 시연</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./scenario-tools.css">
  <link rel="stylesheet" href="./map-preview.css">
  <link rel="stylesheet" href="./demo-shell.css">
  <link rel="stylesheet" href="./operations.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <a class="skip-link" href="#page-heading">본문으로 이동</a>
  <header class="demo-header" id="demo-header"></header>
  <div class="demo-layout">
    <aside class="demo-navigation" id="demo-navigation"></aside>
    <main class="page-body demo-main">
      <section class="page-intro" aria-labelledby="page-heading">
        <div><p class="eyebrow" id="page-eyebrow">차량 1대 · 배송지 8곳</p><h1 id="page-heading" tabindex="-1">배송 현황</h1><p class="intro-copy" id="page-description">배송 순서 · 고객 안내 ETA · 계산 ETA</p></div>
        <div class="page-actions"><div class="summary-counts" id="summary-counts" aria-label="현재 배송 요약"></div></div>
      </section>
      <section class="connection-panel view-content" id="connection-panel" aria-live="polite">
        <div class="panel loading-state"><span class="loading-dot" aria-hidden="true"></span><div><strong id="connection-title">실시간 시뮬레이션에 연결하고 있습니다.</strong><p id="connection-detail">잠시만 기다려 주세요.</p></div><button type="button" class="button" id="retry-connection" hidden>다시 연결</button></div>
      </section>
      <div id="live-pages" hidden>
        <section id="page-deliveries" class="page-view view-content" data-page="deliveries" aria-label="배송 현황">
          <div class="deliveries-layout">
            <section class="panel delivery-list-panel" aria-labelledby="delivery-list-heading">
              <div class="panel-heading"><h2 id="delivery-list-heading">배송 목록</h2><span id="delivery-count" class="muted"></span></div>
              <div class="list-toolbar">
                <label class="field"><span>배송 검색</span><input type="search" id="delivery-search" placeholder="정차지·주소 검색" autocomplete="off"></label>
                <label class="field"><span>배송 상태</span><select id="delivery-status"><option value="all">전체 상태</option><option value="pending">대기</option><option value="current">배송 중</option><option value="done">완료</option><option value="skipped">건너뜀</option></select></label>
                <button type="button" class="button subtle" id="clear-filters">초기화</button>
              </div>
              <div class="table-scroll" role="region" aria-label="배송 목록 표" tabindex="0"><table class="delivery-table"><caption class="sr-only">실시간 시뮬레이션 배송 목록</caption><thead><tr><th scope="col">배송 순서와 배송지</th><th scope="col">상태</th><th scope="col">고객 공식 ETA</th><th scope="col">계산 ETA</th><th scope="col">도착 및 완료</th></tr></thead><tbody id="delivery-rows"></tbody></table></div>
              <div class="empty-state" id="delivery-empty" hidden><strong>조회 결과가 없습니다.</strong><p>검색어나 상태 조건을 바꿔 주세요.</p></div>
            </section>
            <aside class="panel delivery-selection" id="delivery-selection" aria-label="선택 배송 요약"></aside>
          </div>
        </section>
        <section id="page-manage" class="page-view view-content" data-page="manage" aria-label="배송 관리" hidden>
          <div class="management-layout">
            <section class="panel" id="route-editor" aria-label="차량 배송 순서"></section>
            <section class="panel detail-panel" aria-label="선택 배송 이력">
              <div class="panel-heading"><h2 id="manage-selected-name">선택 배송 이력</h2></div>
              <div class="detail-tabs" role="tablist" aria-label="배송 이력">
                <button type="button" role="tab" id="tab-events" aria-selected="true" aria-controls="panel-events" data-tab="events">사건 이력</button>
                <button type="button" role="tab" id="tab-notifications" aria-selected="false" aria-controls="panel-notifications" tabindex="-1" data-tab="notifications">고객 알림 문구</button>
              </div>
              <div class="tab-panel" role="tabpanel" id="panel-events" aria-labelledby="tab-events"><p class="notification-description">차량 전체 사건 · 최신순</p><ol class="timeline" id="event-list"></ol></div>
              <div class="tab-panel" role="tabpanel" id="panel-notifications" aria-labelledby="tab-notifications" hidden><div id="notification-list"></div></div>
            </section>
          </div>
        </section>
        <section id="page-control" class="page-view view-content" data-page="control" aria-label="배송 관제" hidden>
          <div class="monitor-selection"><section id="selected-heading" class="selected-heading" aria-label="선택 배송" tabindex="-1"></section><label class="field"><span>관제 배송 선택</span><select id="monitor-delivery"></select></label></div>
          <div class="monitor-layout">
            <section class="map-preview panel" id="map-preview" aria-labelledby="map-preview-heading"><div><h2 id="map-preview-heading">지도 미리보기</h2></div></section>
            <div class="monitor-detail">
              <section class="panel" id="eta-panel" aria-labelledby="eta-heading"></section>
              <section class="panel detail-panel" aria-labelledby="monitor-timeline-heading"><div class="panel-heading"><h2 id="monitor-timeline-heading">배송 타임라인</h2></div><div class="tab-panel"><ol class="timeline" id="delivery-timeline"></ol></div></section>
            </div>
          </div>
        </section>
      </div>
      <p class="footer-note page-footer">시연 데이터 · 실제 장치 연결·알림 발송 없음</p>
      <p class="sr-only" id="screen-status" role="status" aria-live="polite" aria-atomic="true"></p>
    </main>
  </div>
</body>
</html>
