<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="no-referrer">
  <title>미트박스 TMS</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./brand.css">
  <link rel="icon" href="./assets/meatbox-app.webp">
  <link rel="stylesheet" href="./scenario-tools.css">
  <link rel="stylesheet" href="./demo-shell.css">
  <link rel="stylesheet" href="./operations.css">
  <link rel="stylesheet" href="./order-planning.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <a class="skip-link" href="#page-heading">본문으로 이동</a>
  <header class="demo-header" id="demo-header"></header>
  <div class="demo-layout">
    <aside class="demo-navigation" id="demo-navigation"></aside>
    <main class="page-body demo-main">
      <section class="page-intro" aria-labelledby="page-heading">
        <div><h1 id="page-heading" tabindex="-1">배송 목록</h1><p class="intro-copy" id="page-description">130대 차량의 전체 배송지 현황</p></div>
        <div class="page-actions"><div class="summary-counts" id="summary-counts" aria-label="현재 배송 요약"></div></div>
      </section>
      <section class="connection-panel view-content" id="connection-panel" aria-live="polite">
        <div class="panel loading-state"><span class="loading-dot" aria-hidden="true"></span><div><strong id="connection-title">배송 정보를 불러오고 있습니다.</strong><p id="connection-detail">잠시만 기다려 주세요.</p></div><button type="button" class="button" id="retry-connection" hidden>다시 연결</button></div>
      </section>
      <div id="live-pages" hidden>
        <section id="page-deliveries" class="page-view view-content" data-page="deliveries" aria-label="배송 목록">
          <div class="deliveries-layout">
            <section class="panel delivery-list-panel" aria-labelledby="delivery-list-heading">
              <div class="panel-heading"><h2 id="delivery-list-heading">배송 목록</h2><span id="delivery-count" class="muted"></span></div>
              <div class="list-toolbar">
                <label class="field"><span>배송 검색</span><span class="search-control"><span data-field-icon="search"></span><input type="search" id="delivery-search" placeholder="정차지·주소 검색" autocomplete="off"></span></label>
                <label class="field"><span>차량</span><select id="delivery-vehicle"><option value="all">전체 차량</option></select></label>
                <label class="field"><span>배송 상태</span><select id="delivery-status"><option value="all">전체 상태</option><option value="pending">대기</option><option value="current">배송 중</option><option value="done">완료</option><option value="skipped">보류</option></select></label>
                <button type="button" class="button subtle" id="clear-filters">초기화</button>
              </div>
              <div class="table-scroll fleet-table-scroll" role="region" aria-label="배송 목록 표" tabindex="0"><table class="delivery-table fleet-delivery-table"><caption class="sr-only">차량별 전체 배송 목록</caption><thead><tr><th scope="col">차량번호</th><th scope="col">배송원</th><th scope="col">순서</th><th scope="col">배송지</th><th scope="col">주소</th><th scope="col">박스</th><th scope="col">상태</th><th scope="col">운영 ETA</th><th scope="col">고객 안내</th><th scope="col">도착</th><th scope="col">완료</th></tr></thead><tbody id="delivery-rows"></tbody></table></div>
              <div class="empty-state" id="delivery-empty" hidden><strong>조회 결과가 없습니다.</strong><p>검색어나 상태 조건을 바꿔 주세요.</p></div>
            </section>
            <aside class="panel delivery-selection" id="delivery-selection" aria-label="선택 배송 요약"></aside>
          </div>
        </section>
        <section id="page-orders" class="page-view view-content" data-page="orders" aria-label="주문 관리" hidden>
          <div id="order-planning"></div>
        </section>
        <section id="page-control" class="page-view view-content" data-page="control" aria-label="배송 관제" hidden>
          <div class="monitor-layout">
            <div class="monitor-workspace">
              <div class="monitor-detail" id="monitor-detail">
                <section class="panel" id="eta-panel" aria-labelledby="eta-heading" tabindex="-1"></section>
                <section class="panel detail-panel" id="monitor-timeline" aria-labelledby="monitor-timeline-heading"><div class="panel-heading"><h2 id="monitor-timeline-heading">배송 타임라인</h2></div><div class="tab-panel"><ol class="timeline" id="delivery-timeline" tabindex="0" aria-label="배송 타임라인 기록"></ol></div></section>
              </div>
              <section class="panel detail-panel" aria-label="선택 배송 이력">
                <div class="panel-heading"><h2>운영 기록</h2></div>
                <div class="detail-tabs" role="tablist" aria-label="배송 이력">
                  <button type="button" role="tab" id="tab-events" aria-selected="false" aria-controls="panel-events" tabindex="-1" data-tab="events">사건 이력</button>
                  <button type="button" role="tab" id="tab-notifications" aria-selected="true" aria-controls="panel-notifications" data-tab="notifications">고객 알림</button>
                </div>
                <div class="tab-panel" role="tabpanel" id="panel-events" aria-labelledby="tab-events" hidden><p class="notification-description">선택 차량의 최근 사건</p><ol class="timeline" id="event-list" tabindex="0" aria-label="선택 차량 사건 기록"></ol></div>
                <div class="tab-panel" role="tabpanel" id="panel-notifications" aria-labelledby="tab-notifications"><div class="notification-actions"><p class="notification-description">최근 발송한 고객 알림</p><button type="button" class="button primary" id="open-notice-dialog">고객 안내 작성</button></div><p id="notice-send-status" class="route-message" role="status" hidden></p><div id="notification-list"></div></div>
              </section>
            </div>
            <aside class="monitor-sidebar panel" aria-label="배송 관제 관리 영역">
              <div class="detail-tabs control-tabs" role="tablist" aria-label="관제 관리">
                <button type="button" role="tab" id="tab-monitor" aria-selected="true" aria-controls="monitor-list-panel" data-control-tab="monitor">배송지 목록</button>
                <button type="button" role="tab" id="tab-management" aria-selected="false" aria-controls="route-editor" tabindex="-1" data-control-tab="management">배송 관리</button>
              </div>
              <section id="monitor-list-panel" role="tabpanel" aria-labelledby="tab-monitor">
                <div class="panel-heading monitor-toolbar"><h2 id="monitor-list-heading">배송지 <span id="monitor-count" class="muted"></span></h2><button type="button" class="button subtle" id="monitor-current" data-monitor-current hidden>현재 배송지 보기</button></div>
                <ol class="monitor-deliveries" id="monitor-deliveries" tabindex="0" aria-label="선택 차량 배송지 목록"></ol>
              </section>
              <section id="route-editor" role="tabpanel" aria-labelledby="tab-management" hidden></section>
            </aside>
          </div>
        </section>
      </div>
      <p class="sr-only" id="screen-status" role="status" aria-live="polite" aria-atomic="true"></p>
    </main>
  </div>
  <dialog id="customer-notice-dialog" class="customer-notice-dialog" aria-labelledby="customer-notice-heading">
    <form method="dialog" id="customer-notice-form">
      <div class="notice-dialog-heading"><div><h2 id="customer-notice-heading">고객 안내 작성</h2><p id="customer-notice-target"></p></div><button type="submit" class="notice-dialog-close" value="cancel" formnovalidate aria-label="닫기"><span data-field-icon="close"></span></button></div>
      <label class="field" for="customer-notice-body"><span>안내 문구</span><textarea id="customer-notice-body" maxlength="300" rows="5" required></textarea></label>
      <div class="notice-dialog-footer"><span id="customer-notice-count">0 / 300</span><div><button type="submit" class="button subtle" value="cancel" formnovalidate>취소</button><button type="button" class="button primary" id="send-customer-notice">팝업 보내기</button></div></div>
    </form>
  </dialog>
</body>
</html>
