<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>미트박스 TMS</title>
  <link rel="stylesheet" href="/theme.css">
<link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./brand.css">
  <link rel="icon" href="/combined/assets/meatbox-app.webp">
  <link rel="stylesheet" href="./operations.css">
  <link rel="stylesheet" href="./vehicle-control.css">
  <link rel="stylesheet" href="./driver-tools.css">
  <link rel="stylesheet" href="./customer-requests.css">
  <link rel="stylesheet" href="./resource-management.css">
  <link rel="stylesheet" href="./date-picker.css">
  <link rel="stylesheet" href="/combined/assets/vendor/maplibre/maplibre-gl.css">
  <link rel="stylesheet" href="./order-planning.css">
  <link rel="stylesheet" href="./status-notification.css">
  <script type="module" src="./app.mjs"></script>
</head>
<body>
  <a class="skip-link" href="#page-heading">본문으로 이동</a>
  <header class="app-header" id="app-header"></header>
  <div class="app-shell">
    <aside class="app-navigation" id="app-navigation"></aside>
    <main class="page-body">
      <section class="page-intro" aria-labelledby="page-heading">
        <div><h1 id="page-heading" tabindex="-1">배차 관리</h1><p class="intro-copy" id="page-description">차량별 배정과 전체 주문 위치</p></div>
      </section>
      <div class="toast-stack"><div id="progress-notification" class="status-notification" hidden></div><div id="status-notification" class="status-notification" hidden></div></div>
      <div id="live-pages" hidden>
        <section id="page-deliveries" class="page-view view-content" data-page="deliveries" aria-label="자원 관리">
          <div id="resource-management"></div>
        </section>
        <section id="page-orders" class="page-view view-content" data-page="orders" aria-label="배차 관리" hidden>
          <div id="order-planning"></div>
        </section>
        <section id="page-control" class="page-view view-content" data-page="control" aria-label="배송 관제" hidden>
          <div id="control-date-toolbar"></div>
          <div id="vehicle-control"></div>
        </section>
      </div>
      <p class="sr-only" id="screen-status" role="status" aria-live="polite" aria-atomic="true"></p>
    </main>
  </div>
  <script src="/combined/assets/vendor/maplibre/maplibre-gl-csp.js"></script>
</body>
</html>
