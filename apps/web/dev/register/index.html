<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <meta name="color-scheme" content="light">
    <title>미트박스 TMS</title>
    <link rel="stylesheet" href="/portal.css">
  </head>
  <body>
    <a class="skip" href="#main">본문으로 이동</a>
    <header>
      <a class="brand" href="/"><img src="/portal-logo.svg" width="126" height="30" alt="미트박스"><span>TMS</span></a>
    </header>
    <main id="main" class="auth-shell">
      <section class="auth-card">
        <p class="eyebrow">개발용 접근</p>
        <h1>회원가입</h1>
        <p class="intro">미트박스 TMS 검토용 계정을 만듭니다.</p>
        <p class="error" role="alert" data-auth-error hidden></p>
        <form method="post" action="/dev/register" class="auth-form" data-validate data-auth-kind="register">
          <div class="form-field">
            <label for="invite">초대 코드</label>
            <input id="invite" name="invite" type="text" autocomplete="off" required minlength="16" maxlength="256" spellcheck="false" aria-describedby="invite-feedback" data-required="초대 코드를 입력해 주세요." data-too-short="코드 전체를 빠짐없이 붙여넣어 주세요." data-too-long="초대 코드 외의 내용이 포함되어 있습니다.">
            <p class="field-feedback" id="invite-feedback" data-hint="전달받은 코드를 붙여넣으세요." aria-live="polite" aria-atomic="true">전달받은 코드를 붙여넣으세요.</p>
          </div>
          <div class="form-field">
            <label for="username">아이디</label>
            <input id="username" name="username" type="text" autocomplete="username" required minlength="3" maxlength="40" pattern="[A-Za-z0-9](?:[A-Za-z0-9_.]|-){2,39}" aria-describedby="username-feedback" data-required="아이디를 입력해 주세요." data-too-short="3자 이상으로 입력해 주세요." data-too-long="40자 이내로 입력해 주세요." data-pattern="영문 또는 숫자로 시작하는 아이디를 입력해 주세요.">
            <p class="field-feedback" id="username-feedback" data-hint="영문 또는 숫자로 시작하는 3~40자" aria-live="polite" aria-atomic="true">영문 또는 숫자로 시작하는 3~40자</p>
          </div>
          <div class="form-field">
            <label for="displayName">표시 이름 <span class="optional">선택</span></label>
            <input id="displayName" name="displayName" type="text" autocomplete="nickname" maxlength="80" pattern="[^\u0000-\u001F\u007F]*" aria-describedby="displayName-feedback" data-required="표시 이름 입력이 필요합니다." data-too-long="80자 이내로 입력해 주세요." data-pattern="표시 이름에 제어 문자를 사용할 수 없습니다." data-whitespace="표시 이름을 입력하거나 비워 주세요.">
            <p class="field-feedback" id="displayName-feedback" data-hint="화면에 표시할 이름입니다." aria-live="polite" aria-atomic="true">화면에 표시할 이름입니다.</p>
          </div>
          <div class="form-field">
            <label for="password">비밀번호</label>
            <input id="password" name="password" type="password" autocomplete="new-password" required minlength="8" maxlength="128" aria-describedby="password-feedback" data-required="비밀번호를 입력해 주세요." data-too-short="8자 이상으로 늘려 주세요." data-too-long="128자 이내로 입력해 주세요.">
            <p class="field-feedback" id="password-feedback" data-hint="8자 이상" aria-live="polite" aria-atomic="true">8자 이상</p>
          </div>
          <button class="primary" type="submit">계정 만들기</button>
        </form>
        <a class="text-link" href="/login">로그인으로 돌아가기</a>
      </section>
    </main>
    <script src="/portal-validation.js" defer></script>
    <script type="module" src="/portal-auth.js"></script>
  </body>
</html>
