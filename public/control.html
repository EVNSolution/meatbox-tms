<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>미트박스 TMS 관제</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="/shared.css" />
<style>
  body { overflow: hidden; }
  .topbar {
    height: 58px; background: var(--ink); color: #fff;
    display: flex; align-items: center; gap: 18px; padding: 0 20px;
  }
  .topbar .logo { color: #ff6b6b; font-size: 18px; }
  .topbar .logo small { color: #9aa0b4; }
  .topbar .ttl { font-weight: 800; font-size: 15px; }
  .topbar .clock { margin-left: auto; font-size: 22px; font-weight: 900; font-variant-numeric: tabular-nums; }
  .topbar .phase { font-size: 12px; }
  .layout { display: flex; height: calc(100vh - 58px); }
  #map { flex: 1; height: 100%; }
  .side { width: 400px; flex: 0 0 400px; overflow-y: auto; background: var(--bg); padding: 4px 2px 20px; }
  .side .card { margin: 10px 12px; padding: 14px; }
  .ctl-row { display: flex; gap: 8px; margin-bottom: 8px; }
  .ctl-row .btn { flex: 1; }
  .seg { display: flex; background: #eef0f5; border-radius: 10px; padding: 3px; flex: 1; }
  .seg button {
    flex: 1; border: 0; background: transparent; border-radius: 8px; padding: 8px 0;
    font-weight: 800; font-size: 12.5px; color: var(--ink-3); cursor: pointer; font-family: inherit;
  }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,0.12); }
  .kpis { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .kpi { background: #f6f7fa; border-radius: 10px; padding: 10px 12px; }
  .kpi .v { font-size: 17px; font-weight: 900; }
  .kpi .k { font-size: 11px; color: var(--ink-3); margin-top: 1px; }
  .stop-table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .stop-table td { padding: 6px 4px; border-bottom: 1px solid var(--line); }
  .stop-table tr:last-child td { border-bottom: 0; }
  .log { font-size: 12px; line-height: 1.5; max-height: 260px; overflow-y: auto; }
  .log div { padding: 4px 0; border-bottom: 1px dashed #edeef3; display: flex; gap: 8px; }
  .log .lt { color: var(--ink-3); flex: 0 0 38px; font-variant-numeric: tabular-nums; }
  .log .scan { color: var(--ink-2); }
  .log .eta { color: #1565c0; font-weight: 700; }
  .log .incident { color: var(--red); font-weight: 800; }
  .log .driver { color: #6a1b9a; font-weight: 700; }
  .log .notify { color: var(--amber); font-weight: 700; }
  .log .system { color: var(--ink-3); }
</style>
</head>
<body>
<div class="topbar">
  <span class="logo logo">MEATBOX<small> 미트박스</small></span>
  <span class="ttl">TMS 관제센터 — 수도권 4권역 (데모)</span>
  <span class="pill gray phase" id="phase">대기</span>
  <span class="clock" id="clock">--:--</span>
</div>
<div class="layout">
  <div id="map"></div>
  <div class="side">
    <div class="card">
      <h3>발표 컨트롤</h3>
      <div class="ctl-row">
        <button class="btn primary" id="start">▶ 시나리오 시작</button>
        <button class="btn ghost" id="reset">↺ 리셋</button>
      </div>
      <div class="ctl-row">
        <div class="seg" id="speed">
          <button data-v="1">1x</button>
          <button data-v="5" class="on">5x</button>
          <button data-v="20">20x</button>
        </div>
      </div>
      <div class="ctl-row">
        <button class="btn dark" id="traffic">🚨 교통사고 주입</button>
        <button class="btn dark" id="dwell">⏱ 정차 지연 주입</button>
      </div>
      <div style="font-size:11.5px;color:var(--ink-3);line-height:1.5;">
        기사 순서 변경은 <b>/driver</b> 화면에서, 고객 화면은 <b>/customer</b>에서 실시간 확인
      </div>
    </div>

    <div class="card">
      <h3>운영 KPI</h3>
      <div class="kpis">
        <div class="kpi"><div class="v" id="k-load">70/70박스</div><div class="k">상차 적재 (적재율 100%)</div></div>
        <div class="kpi"><div class="v" id="k-done">0/8착지</div><div class="k">배송 완료</div></div>
        <div class="kpi"><div class="v" id="k-eta">—</div><div class="k">⭐ 호수정육식당 ETA</div></div>
        <div class="kpi"><div class="v">82.4%</div><div class="k">±15분 적중률 (최근 30일)</div></div>
      </div>
      <div id="incident" style="display:none; margin-top:9px;" class="pill amber">🚨 실시간 교통: 탄천대로 사고 — 지연 계수 반영 중</div>
    </div>

    <div class="card">
      <h3>정차지 현황</h3>
      <table class="stop-table" id="stops"></table>
    </div>

    <div class="card">
      <h3>이벤트 로그 <span style="font-weight:400;color:var(--ink-3);">— 구간 스캔 · ETA 재계산 · 알림</span></h3>
      <div class="log" id="log"></div>
    </div>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="/common.js"></script>
<script src="/control.js"></script>
</body>
</html>
