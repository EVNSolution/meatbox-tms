<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>미트박스 TMS — 발표 리모컨</title>
<link rel="stylesheet" href="/shared.css" />
<style>
  body { background: var(--ink); min-height: 100vh; }
  .wrap { max-width: 460px; margin: 0 auto; padding: 26px 16px 40px; }
  .head { color: #fff; display: flex; align-items: baseline; gap: 8px; margin-bottom: 14px; }
  .head .logo { font-size: 18px; }
  .head .t { font-size: 14px; font-weight: 700; color: #aab0c2; }
  .status { display: flex; align-items: center; gap: 12px; }
  .status .clock { font-size: 34px; font-weight: 900; font-variant-numeric: tabular-nums; margin-left: auto; }
  .prog { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 12px; }
  .prog div { background: #f6f7fa; border-radius: 10px; padding: 9px 11px; }
  .prog .v { font-size: 15px; font-weight: 900; }
  .prog .k { font-size: 10.5px; color: var(--ink-3); margin-top: 1px; }
  .bigstart { width: 100%; font-size: 17px; padding: 16px; }
  .row { display: flex; gap: 8px; }
  .row .btn { flex: 1; }
  .row + .row { margin-top: 8px; }
  .seg { display: flex; background: #eef0f5; border-radius: 10px; padding: 3px; flex: 1; }
  .seg button { flex: 1; border: 0; background: transparent; border-radius: 8px; padding: 10px 0; font-weight: 800; font-size: 13px; color: var(--ink-3); cursor: pointer; font-family: inherit; }
  .seg button.on { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,0.12); }
  .log { font-size: 12px; line-height: 1.55; }
  .log div { padding: 3px 0; border-bottom: 1px dashed #edeef3; display: flex; gap: 8px; }
  .log div:last-child { border-bottom: 0; }
  .log .lt { color: var(--ink-3); flex: 0 0 36px; font-variant-numeric: tabular-nums; }
  .links { display: flex; gap: 8px; margin-top: 4px; }
  .links a { flex: 1; text-align: center; text-decoration: none; color: #fff; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.18); border-radius: 10px; padding: 10px 0; font-size: 12.5px; font-weight: 700; }
  .hint { color: #78809a; font-size: 11.5px; line-height: 1.6; margin-top: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <span class="logo logo">MEATBOX</span>
    <span class="t">TMS 데모 · 발표 리모컨</span>
  </div>

  <div class="card" style="margin:0 0 10px;">
    <div class="status">
      <span class="pill gray" id="phase">대기</span>
      <span class="pill amber" id="incident" style="display:none;">🚨 사고 반영 중</span>
      <span class="clock mono" id="clock">--:--</span>
    </div>
    <div class="prog">
      <div><div class="v" id="p-done">0/8</div><div class="k">완료 착지</div></div>
      <div><div class="v" id="p-boxes">70</div><div class="k">잔여 박스</div></div>
      <div><div class="v" id="p-eta">—</div><div class="k">금일 완료 예상</div></div>
    </div>
  </div>

  <div class="card" style="margin:0 0 10px;">
    <button class="btn primary bigstart" id="start">▶ 다음 단계</button>
    <div class="row" style="margin-top:8px;">
      <div class="seg" id="speed">
        <button data-v="1">1x</button>
        <button data-v="5" class="on">5x</button>
        <button data-v="20">20x</button>
      </div>
      <button class="btn ghost" id="reset">↺ 리셋</button>
    </div>
    <div class="row">
      <button class="btn dark" id="traffic">🚨 교통사고 주입</button>
      <button class="btn dark" id="dwell">⏱ 정차 지연 주입</button>
    </div>
  </div>

  <div class="card" style="margin:0 0 12px;">
    <h3>최근 이벤트</h3>
    <div class="log" id="log"></div>
  </div>

  <div class="links">
    <a href="/customer" target="_blank">📱 고객</a>
    <a href="/driver" target="_blank">🚚 기사</a>
    <a href="/control" target="_blank">🗺️ 관제</a>
  </div>
  <div class="hint">
    기사 순서 변경(ETA 재계산 트리거)은 기사 앱에서 ▲▼로. 사고 주입 시 고객에게
    "배송 예정 시간 변경" 알림이 발송됩니다. 이 페이지는 발표자 전용 — 고객사에는 고객/기사/관제 화면만 보여주세요.
  </div>
</div>

<script src="/common.js"></script>
<script src="/present.js"></script>
</body>
</html>
