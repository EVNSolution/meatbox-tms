name: Deploy TEST release

on:
  workflow_run:
    workflows: [New stack checks]
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful New stack checks run ID from current main or a trusted same-repository PR
        required: true
        type: string

concurrency:
  group: meatbox-test-deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      ${{
        (github.event_name == 'workflow_run' &&
          github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == github.event.repository.default_branch) ||
        github.event_name == 'workflow_dispatch'
      }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: test
    permissions:
      actions: read
      contents: read
      id-token: write
      pull-requests: read
    env:
      AWS_REGION: ap-northeast-2
      GITHUB_TOKEN: ${{ github.token }}
      GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      MEATBOX_TEST_INSTANCE_ID: ${{ vars.MEATBOX_TEST_INSTANCE_ID }}
      MEATBOX_TEST_HOST: ${{ vars.MEATBOX_TEST_HOST }}
      MEATBOX_TEST_AZ: ${{ vars.MEATBOX_TEST_AZ }}
      MEATBOX_TEST_KNOWN_HOSTS: ${{ vars.MEATBOX_TEST_KNOWN_HOSTS }}
    steps:
      - name: Resolve selected verified run
        id: selected
        env:
          AUTO_RUN_ID: ${{ github.event.workflow_run.id }}
          MANUAL_RUN_ID: ${{ inputs.run_id }}
        run: |
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then
            test "${{ github.ref_name }}" = "$GITHUB_DEFAULT_BRANCH"
            [[ "$MANUAL_RUN_ID" =~ ^[0-9]+$ ]] || { echo 'run_id must be numeric' >&2; exit 64; }
            printf 'run_id=%s\ntrigger=manual\n' "$MANUAL_RUN_ID" >> "$GITHUB_OUTPUT"
          else
            printf 'run_id=%s\ntrigger=auto\n' "$AUTO_RUN_ID" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26.3.1'
          package-manager-cache: false
      - name: Download verified release artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: meatbox-test-release
          path: .runtime/ci-release
          github-token: ${{ github.token }}
          run-id: ${{ steps.selected.outputs.run_id }}
          digest-mismatch: error
      - name: Recheck run freshness and artifact identity
        env:
          GITHUB_REF_NAME: ${{ github.ref_name }}
        run: |
          node deploy/new-stack/verify-ci-artifact.mjs \
            --run-id '${{ steps.selected.outputs.run_id }}' \
            --trigger '${{ steps.selected.outputs.trigger }}' \
            --artifact-dir .runtime/ci-release \
            --output .runtime/trusted-test-release.json
      - name: Configure TEST AWS identity
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.MEATBOX_TEST_ROLE_ARN }}
          aws-region: ap-northeast-2
      - name: Deploy immutable native release
        run: |
          deploy/new-stack/deploy-ci-artifact.sh \
            .runtime/trusted-test-release.json \
            .runtime/test-deploy-result.json
      - name: Publish deployment timing summary
        if: always()
        run: |
          if [ -f .runtime/test-deploy-result.json ]; then
            # shellcheck disable=SC2016
            node -e '
              const fs = require("fs");
              const value = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
              const t = value.timingsMs;
              fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
                `## TEST deployment\n\n- Result: ${value.status}\n- Release: ${value.releaseId}\n- Snapshot: ${t.snapshot} ms\n- Transfer: ${t.transfer} ms\n- Rollout: ${t.rollout} ms\n- Total: ${t.total} ms\n`);
            ' .runtime/test-deploy-result.json
          else
            printf '## TEST deployment\n\nDeployment did not reach a result record.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
